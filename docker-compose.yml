# flagforge, locally.
#
#   docker compose up -d                       Postgres only (enough to develop admin-api)
#   docker compose --profile infra up -d       + Kafka (KRaft), Redis, Kafka UI (:8090): run services from sbt
#   docker compose --profile apps up -d        the whole system in containers
#
# Service images are built with: sbt Docker/publishLocal
# Host ports can be overridden: POSTGRES_PORT, REDIS_PORT.
name: flagforge

x-healthcheck: &http-health
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 10s

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: flagforge
  DB_PASSWORD: flagforge
  DB_NAME: flagforge

services:
  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagforge
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    profiles: [infra, apps]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    profiles: [infra, apps]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    profiles: [infra, apps]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------- flagforge services

  admin-api:
    image: flagforge/admin-api:latest
    profiles: [apps]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      <<: [*db-env, *kafka-env]
      HTTP_PORT: "8080"
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]

  flag-delivery:
    image: flagforge/flag-delivery:latest
    profiles: [apps]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      <<: *kafka-env
      HTTP_PORT: "8081"
      REDIS_URI: redis://redis:6379
    healthcheck:
      <<: *http-health
      # ready = the change feed has been loaded
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]

  event-ingest:
    image: flagforge/event-ingest:latest
    profiles: [apps]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8083:8083"
    environment:
      <<: *kafka-env
      HTTP_PORT: "8083"
      REDIS_URI: redis://redis:6379
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]

  stats-engine:
    image: flagforge/stats-engine:latest
    profiles: [apps]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8082:8082"
    environment:
      <<: [*db-env, *kafka-env]
      HTTP_PORT: "8082"
    healthcheck:
      <<: *http-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]

volumes:
  pg-data:
