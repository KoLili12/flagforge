version = 3.11.3
runner.dialect = scala3
maxColumn = 110
align.preset = more
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
newlines.source = keep
fileOverride {
  "glob:**/project/**" { runner.dialect = scala212source3 }
  "glob:**.sbt"        { runner.dialect = sbt1 }
}
